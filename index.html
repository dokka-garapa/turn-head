<style>

#langs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
#bnote{font-size:13px;font-weight:700;letter-spacing:.03em;line-height:1.3;color:var(--accent);margin-top:-2px}

#grid{display:grid;gap:0;pointer-events:none}
.ref{display:flex;align-items:center;justify-content:center;overflow:hidden}
.ref canvas{width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--line);pointer-events:none}
#c-t{grid-area:1/1}#c-f{grid-area:2/2}
#wrap{position:relative;grid-area:2/1;min-width:0;min-height:0;pointer-events:none}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%;background:#fff;border:2px solid var(--fg)}
#draw{pointer-events:auto!important;cursor:crosshair}
#wrap #guide{pointer-events:none;background:transparent;border-color:transparent}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:clamp(18px,5vw,30px);font-weight:700;color:#222;opacity:.55;pointer-events:none;transition:opacity .25s}
#msg.hide{opacity:0}
#bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding-top:2px;pointer-events:none}
button{pointer-events:auto;touch-action:none;font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg)}
button.on{border-color:var(--fg)}
button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:disabled{opacity:.4}
#result{display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;flex:none;pointer-events:none}
#result img{max-width:92vw;max-height:46vh;border:2px solid var(--fg);background:#fff;pointer-events:auto;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#result p{margin:0;font-size:14px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none}
</style>

function blank(){ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S)}
function lines(g,size,h,v,col,lw){
  g.strokeStyle=col;g.lineWidth=lw;g.setLineDash([lw*4,lw*3]);
  FR.forEach(function(f){
    if(h){g.beginPath();g.moveTo(0,f*size);g.lineTo(size,f*size);g.stroke()}
    if(v){g.beginPath();g.moveTo(f*size,0);g.lineTo(f*size,size);g.stroke()}

}

}
function layout(){
  var W=innerWidth-16,H=innerHeight-262-(parseInt(getComputedStyle(document.documentElement).paddingTop)||0);

function pos(e){var r=draw.getBoundingClientRect();return{x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height}}

function startEdit(i){

// ---- GIFエンコーダ（グレースケール256色） ----
function lzw(idx,mc){
  var clear=1<<mc,eoi=clear+1,bits=mc+1,next=eoi+1,dict=new Map(),out=[],cur=0,nb=0;
  function emit(c){cur|=c<<nb;nb+=bits;while(nb>=8){out.push(cur&255);cur>>>=8;nb-=8}}
  emit(clear);var p=idx[0];
  for(var i=1;i<idx.length;i++){
    var k=idx[i],key=(p<<8)|k,v=dict.get(key);
    if(v!==undefined){p=v}
    else{
      emit(p);
      if(next<4096){dict.set(key,next);if(next===(1<<bits))bits++;next++}
      else{emit(clear);dict.clear();bits=mc+1;next=eoi+1}
      p=k;
    }
  }
  emit(p);emit(eoi);if(nb>0)out.push(cur&255);
  return out;
}
function makeGif(cvs,w,h,delay){
  var b=[],i;
  function s(t){for(var j=0;j<t.length;j++)b.push(t.charCodeAt(j))}
  function w16(n){b.push(n&255,(n>>8)&255)}
  s('GIF89a');w16(w);w16(h);b.push(0xF7,0,0);
  for(i=0;i<256;i++)b.push(i,i,i);
  b.push(0x21,0xFF,0x0B);s('NETSCAPE2.0');b.push(3,1,0,0,0);
  cvs.forEach(function(c){
    var d=c.getContext('2d').getImageData(0,0,w,h).data,idx=new Uint8Array(w*h);
    for(var q=0;q<idx.length;q++)idx[q]=(d[q*4]*0.299+d[q*4+1]*0.587+d[q*4+2]*0.114)|0;
    b.push(0x21,0xF9,4,0x04);w16(delay);b.push(0,0);
    b.push(0x2C);w16(0);w16(0);w16(w);w16(h);b.push(0);
    b.push(8);var data=lzw(idx,8);
    for(var o=0;o<data.length;o+=255){var n=Math.min(255,data.length-o);b.push(n);for(var z=0;z<n;z++)b.push(data[o+z])}
    b.push(0);
  });

// ---- 描画スペース外の2本指で拡大縮小・移動 ----
(function(){
  var app=$('app'),Z={s:1,x:0,y:0},P=new Map(),g=null;
  app.style.transformOrigin='0 0';
  function two(){var a=Array.from(P.values());return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
  function apply(){app.style.transform='translate('+Z.x+'px,'+Z.y+'px) scale('+Z.s+')'}
  document.addEventListener('pointerdown',function(e){
    if(e.target===draw||e.target.tagName==='BUTTON'||e.target.tagName==='IMG'||e.target.tagName==='A'||(e.target.closest&&e.target.closest('#credit'))||e.pointerType==='mouse')return;
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===2&&active===null){var t=two();g={d:t.d,mx:t.x,my:t.y,s:Z.s,x:Z.x,y:Z.y}}
  });
  document.addEventListener('pointermove',function(e){
    if(!P.has(e.pointerId))return;
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(!g||P.size<2)return;
    var t=two(),ns=Math.min(4,Math.max(1,g.s*t.d/g.d));
    var cx=(g.mx-g.x)/g.s,cy=(g.my-g.y)/g.s;
    Z.s=ns;
    Z.x=Math.min(0,Math.max(innerWidth*(1-ns),t.x-cx*ns));
    Z.y=Math.min(0,Math.max(innerHeight*(1-ns),t.y-cy*ns));
    apply();
  });
  function up(e){P.delete(e.pointerId);if(P.size<2)g=null}
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
})();
